name: Refresh stats data

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch: {}      # adds a "Run workflow" button on the Actions tab, for an on-demand refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node refresh-data.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static-data.json logos
          git diff --staged --quiet || git commit -m "Auto-refresh stats data"
          git push
